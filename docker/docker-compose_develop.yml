services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: /usr/local/bin/entrypoint.sh
    command: php-fpm -F
    container_name: kondomanager_dev_app
    working_dir: /var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kondomanager_dev
      DB_USERNAME: kondomanager
      DB_PASSWORD: kondomanager
      AUTO_KEYGEN: "true"
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    env_file:
      - ../.env
    volumes:
      - ../:/var/www
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: kondomanager_dev_nginx
    restart: unless-stopped
    ports:
      - "8889:80"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  vite:
    image: docker-app
    container_name: kondomanager_dev_vite
    profiles:
      - frontend
    working_dir: /var/www
    command: sh -lc "npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ../:/var/www
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: kondomanager_dev_db
    environment:
      MYSQL_DATABASE: kondomanager_dev
      MYSQL_USER: kondomanager
      MYSQL_PASSWORD: kondomanager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: kondomanager_dev_phpmyadmin

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: kondomanager
      PMA_PASSWORD: kondomanager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8990:80"

    depends_on:
      - db

